name: Booking Workflow E2E (LocalStack)

on:
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  LOCALSTACK_ENDPOINT: http://localhost:4566

jobs:
  booking-workflow-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LocalStack tooling
        run: |
          python -m pip install --upgrade pip
          pip install awscli-local aws-sam-cli-local

      - name: Start LocalStack
        run: docker compose up -d localstack

      - name: Wait for LocalStack
        run: |
          for _ in $(seq 1 40); do
            if awslocal sts get-caller-identity >/dev/null 2>&1; then
              echo "LocalStack is ready"
              exit 0
            fi
            sleep 3
          done
          echo "LocalStack did not become ready in time"
          exit 1

      - name: Build and deploy stack to LocalStack
        run: |
          STACK_NAME="devopsgroup20-e2e-localstack"
          echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"

          samlocal build --template template.yaml
          samlocal deploy \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          API_ID="$(awslocal cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --logical-resource-id API \
            --query "StackResources[0].PhysicalResourceId" \
            --output text)"

          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            echo "Failed to resolve API id from CloudFormation resources"
            exit 1
          fi

          echo "BOOKING_API_BASE_URL=http://localhost:4566/restapis/${API_ID}/Prod/_user_request_" >> "$GITHUB_ENV"

      - name: Run booking workflow E2E tests
        run: npm run test:e2e:booking

      - name: Dump LocalStack logs on failure
        if: failure()
        run: docker compose logs --no-color localstack

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${STACK_NAME:-}" ]; then
            awslocal cloudformation delete-stack --stack-name "$STACK_NAME" || true
            awslocal cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" || true
          fi
          docker compose down -v
